version: '3.8'

services:
  lzb-ai-platform:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_HASH: ${BUILD_HASH:-dev-build}
    image: ngsankar/lzb-ai-platform:latest
    container_name: lzb-ai-platform
    ports:
      - "3000:8080"
    environment:
      # Basic Configuration
      - WEBUI_NAME=LZB AI Platform
      - WEBUI_URL=http://localhost:3000
      
      # Security (Change these in production!)
      - WEBUI_SECRET_KEY=your-secret-key-change-this
      - JWT_EXPIRES_IN=168h
      
      # Database Configuration
      - DATABASE_URL=sqlite:///app/backend/data/webui.db
      
      # Optional: Ollama Integration
      # - OLLAMA_BASE_URL=http://ollama:11434
      
      # Optional: OpenAI Integration
      # - OPENAI_API_KEY=your-openai-api-key
      
      # Optional: Vector Database
      # - CHROMA_DB_URL=http://chromadb:8000
      
      # File Upload Limits
      - FILE_SIZE_LIMIT=100MB
      - CHUNK_SIZE=1024
      
      # Interface Customization
      - DEFAULT_MODELS=llama2,codellama
      - DEFAULT_PROMPT_SUGGESTIONS=true
      - ENABLE_SIGNUP=true
      
    volumes:
      # Persistent data storage
      - lzb_data:/app/backend/data
      
      # Optional: Custom models directory
      # - ./models:/app/models
      
      # Optional: Custom documents
      # - ./documents:/app/documents
      
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Ollama service for local LLM hosting
  # Uncomment if you want to run Ollama locally
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: lzb-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  # Optional: ChromaDB for vector storage
  # Uncomment if you want to use ChromaDB for RAG
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: lzb-chromadb
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - chroma_data:/chroma/chroma
  #   environment:
  #     - CHROMA_SERVER_HOST=0.0.0.0
  #     - CHROMA_SERVER_HTTP_PORT=8000
  #   restart: unless-stopped

volumes:
  lzb_data:
    driver: local
  # ollama_data:
  #   driver: local
  # chroma_data:
  #   driver: local

networks:
  default:
    name: lzb-ai-platform-network